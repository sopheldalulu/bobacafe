<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="theme-color" content="#ffe6ee"/>
        <title>boba cafa ~ boba shop simulator</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="wrap">
            <header>
                <div class="tag">
                    <h1>boba cafe 🧋</h1>
                    <p>mix sweet drinks, make customers smile, and grow ur boba shop!</p>
                </div>
            </header>

            <section class="stats" aria-label="game statistics">
                <div class="stat">
                    <span>coins</span>🪙
                    <b id="coins">0</b>
                </div>
                <div class="stat">
                    <span>orders served</span>🌷
                    <b id="served">0</b>
                </div>
                <div class="stat">
                    <span>happy streak</span>✨
                    <b id="streak">0</b>
                </div>
                <div class="stat">
                    <span>best streak</span>🏆
                    <b id="best">0</b>
                </div>
            </section>

            <div class="layout">
                <section class="panel-customer" aria-labelledby="customer-heading">
                    <h2 id="customer-heading">at the counter...</h2>
                    <div class="customer-icon" id="customer" aria-hidden="true">🐰</div>
                    <div class="speech">
                        <strong id="customer-name">mochi</strong>
                        <div class="order" id="order">loading order...</div>
                        <small>make it just the way i like it please!!♡</small>
                    </div>
                    <h2>your drink 🧋</h2>
                    <div class="cup-area"
                </section>
            </div>
        </main>
    </body>
</html>
